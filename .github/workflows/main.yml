name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # تثبيت Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # التأكد من نسخة Flutter
      - name: Flutter version
        run: flutter --version

      # تحميل الحزم
      - name: Flutter pub get
        run: flutter pub get

      # إعادة إنشاء ملفات Android الناقصة
      - name: Regenerate Android project
        run: flutter create --platforms=android .

      # تحميل الحزم مرة ثانية
      - name: Flutter pub get again
        run: flutter pub get

      # بناء APK
      - name: Build APK
        run: flutter build apk --release

      # رفع APK كملف يمكن تنزيله من Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trading-signals-apk
          path: build/app/outputs/flutter-apk/app-release.apk
